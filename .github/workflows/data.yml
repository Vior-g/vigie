# Met à jour la base de données de Vigie depuis l'API publique DofusDB.
# - chaque mercredi matin (les mises à jour de Dofus sortent le mardi) ;
# - à chaque modification du script ;
# - à la demande (onglet Actions > Données du jeu > Run workflow).
name: Données du jeu

on:
  schedule:
    - cron: '17 5 * * 3'
  push:
    branches: [main]
    paths: ['scripts/build-data.mjs', '.github/workflows/data.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construire la base depuis DofusDB
        run: node scripts/build-data.mjs

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated data-probe
          if git diff --cached --quiet; then
            echo "Données inchangées."
            exit 0
          fi
          git commit -m "Données du jeu : mise à jour depuis DofusDB"
          git pull --rebase origin main
          git push origin HEAD:main
