# Teste et construit Vigie pour Windows à chaque push sur main.
# Si la version de package.json n'a pas encore de Release, elle est publiée
# (tag vX.Y.Z créé par GitHub) avec Vigie-win-x64.zip.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (géométrie, fiches, reconnaissance, OCR)
        run: npm test

      - name: Construire Vigie.exe
        run: npx electron-builder --win dir --x64 --publish never

      - name: Vérifier le paquet hors du projet (OCR)
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'vigie-app'
          Copy-Item -Recurse dist/win-unpacked/resources/app $iso
          node test/smoke-packaged.js $iso

      - name: Zipper
        shell: pwsh
        run: |
          Rename-Item dist/win-unpacked Vigie
          Compress-Archive -Path dist/Vigie -DestinationPath dist/Vigie-win-x64.zip

      - name: Garder le zip (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Vigie-win-x64
          path: dist/Vigie-win-x64.zip
          retention-days: 14

      - name: Publier la Release (nouvelle version uniquement)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "La Release $v existe déjà : rien à publier (change la version pour publier)."
            exit 0
          fi
          gh release create "$v" dist/Vigie-win-x64.zip --target "$GITHUB_SHA" --title "Vigie $v" --generate-notes
