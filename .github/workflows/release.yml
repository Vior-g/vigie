# Teste et construit Vigie pour Windows à chaque push sur main.
# Si la version de package.json n'a pas encore de Release, elle est publiée
# (tag vX.Y.Z créé par GitHub) avec Vigie-win-x64.zip.
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['scripts/**', 'data-probe/**', '.github/workflows/data.yml']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (géométrie, fiches, reconnaissance, OCR)
        run: npm test

      - name: Test du remplacement de fichiers (mise à jour)
        run: node test/update-swap.js

      - name: Construire Vigie.exe
        run: npx electron-builder --win dir --x64 --publish never

      - name: Vérifier le paquet hors du projet (OCR)
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'vigie-app'
          Copy-Item -Recurse dist/win-unpacked/resources/app $iso
          node test/smoke-packaged.js $iso

      - name: Paquets de mise à jour
        shell: pwsh
        run: |
          $out = 'dist/release'
          $7z = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (!$7z) { $7z = 'C:\Program Files\7-Zip\7z.exe' }
          node scripts/release-meta.mjs dist/win-unpacked/resources/app $out
          # Code seul (sans les modules) : quelques Mo, suffit tant qu'Electron
          # et les modules ne changent pas.
          $tmp = Join-Path $env:RUNNER_TEMP 'pkg'
          robocopy dist/win-unpacked/resources/app (Join-Path $tmp 'app') /E /XD node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Push-Location $tmp; & $7z a -tzip -mx=7 (Join-Path $env:GITHUB_WORKSPACE "$out/vigie-app.zip") app | Out-Null; Pop-Location
          Push-Location dist/win-unpacked/resources/app; & $7z a -tzip -mx=7 (Join-Path $env:GITHUB_WORKSPACE "$out/vigie-modules.zip") node_modules | Out-Null; Pop-Location
          Rename-Item dist/win-unpacked Vigie
          Push-Location dist; & $7z a -tzip -mx=7 (Join-Path $env:GITHUB_WORKSPACE "$out/Vigie-win-x64.zip") Vigie | Out-Null; Pop-Location
          Get-ChildItem $out | Format-Table Name, Length

      - name: Vérifier les archives (tar de Windows, comme chez l'utilisateur)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'x'
          New-Item -ItemType Directory $t | Out-Null
          tar -xf dist/release/vigie-app.zip -C $t
          tar -xf dist/release/vigie-modules.zip -C $t
          if (!(Test-Path "$t/app/package.json") -or !(Test-Path "$t/node_modules/tesseract.js/package.json")) { throw 'archives inattendues' }
          tar -xf dist/release/Vigie-win-x64.zip -C $t
          if (!(Test-Path "$t/Vigie/Vigie.exe")) { throw 'Vigie.exe absent du zip complet' }

      - name: Garder les fichiers (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Vigie-win-x64
          path: dist/release/*
          retention-days: 14

      - name: Publier la Release (nouvelle version uniquement)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "La Release $v existe déjà : rien à publier (change la version pour publier)."
            exit 0
          fi
          cd dist/release
          gh release create "$v" Vigie-win-x64.zip vigie-app.zip vigie-modules.zip vigie-update.json \
            --target "$GITHUB_SHA" --title "Vigie $v" --notes-file release-notes.md
